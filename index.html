<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean & D-Day Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Cinzel:wght@400;600;700;800;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #932943;
      color: #FFF2CC;
      font-family: 'Inter', sans-serif;
    }
    .font-pixel {
      font-family: 'VT323', monospace;
    }
    .font-serif-custom {
      font-family: 'Cinzel', serif;
    }
    .text-yellow-custom {
      color: #FFF2CC;
    }
    .text-pink-custom {
      color: #F8C8DC;
    }
    .bg-card {
      background-color: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-pink-300 selection:text-pink-900">

  <div class="w-full max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8 md:gap-12 py-8">
    
    <!-- Left Section: D-Day & Clean Tracker -->
    <div class="w-full md:w-2/3 flex flex-col items-center text-center space-y-8">
      
      <!-- Top Pixel Banner -->
      <h1 class="font-pixel text-2xl sm:text-3xl tracking-widest uppercase text-yellow-custom">
        NO LOOKING BACK.
      </h1>

      <!-- D-Day Display -->
      <div class="flex flex-col items-center">
        <div id="dday-count" class="text-7xl sm:text-9xl font-black tracking-tight text-yellow-custom leading-none">
          5
        </div>
        <div class="font-serif-custom text-sm sm:text-base font-bold tracking-widest text-pink-custom mt-2 uppercase">
          DAYS UNTIL D-DAY
        </div>
      </div>

      <hr class="w-3/4 border-pink-custom/20 my-2">

      <!-- Clean For Section -->
      <div class="w-full flex flex-col items-center">
        <h2 class="font-serif-custom text-xs sm:text-sm font-semibold tracking-widest text-pink-custom mb-4 uppercase">
          CLEAN FOR
        </h2>

        <!-- Clean Grid -->
        <div class="grid grid-cols-7 gap-2 sm:gap-4 w-full text-center">
          <div>
            <div id="clean-yrs" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">YRS</div>
          </div>
          <div>
            <div id="clean-mos" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">MOS</div>
          </div>
          <div>
            <div id="clean-wks" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">WKS</div>
          </div>
          <div>
            <div id="clean-days" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">DAYS</div>
          </div>
          <div>
            <div id="clean-hrs" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">HRS</div>
          </div>
          <div>
            <div id="clean-min" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">MIN</div>
          </div>
          <div>
            <div id="clean-sec" class="text-xl sm:text-3xl font-extrabold text-yellow-custom">0</div>
            <div class="font-serif-custom text-[10px] sm:text-xs font-normal opacity-80 mt-1 text-pink-custom tracking-wider">SEC</div>
          </div>
        </div>
      </div>

      <!-- Settings Button -->
      <button onclick="toggleSettingsModal()" class="text-xs text-pink-custom/70 hover:text-pink-custom flex items-center gap-1 transition-colors mt-4">
        ⚙️ Edit Dates & Settings
      </button>
    </div>

    <!-- Right Section: Focus Timer -->
    <div class="w-full md:w-1/3 border-t md:border-t-0 md:border-l border-pink-custom/20 pt-8 md:pt-0 md:pl-12 flex flex-col items-center md:items-start text-center md:text-left space-y-6">
      
      <h2 class="font-pixel text-2xl tracking-widest text-yellow-custom uppercase">
        FOCUS
      </h2>

      <div class="flex flex-col items-center md:items-start">
        <div id="timer-display" class="text-6xl sm:text-7xl font-black text-yellow-custom tracking-tight leading-none">
          25:00
        </div>
        <div class="font-serif-custom text-xs font-normal tracking-widest uppercase text-pink-custom opacity-80 mt-2">
          WORK
        </div>
      </div>

      <!-- Timer Controls -->
      <div class="flex gap-3 w-full justify-center md:justify-start pt-2">
        <button id="start-btn" onclick="toggleTimer()" class="px-6 py-2 bg-[#F8C8DC] text-[#932943] font-bold text-sm rounded hover:bg-opacity-90 transition-all uppercase tracking-wider">
          START
        </button>
        <button onclick="resetTimer()" class="px-6 py-2 bg-[#FFF2CC] text-[#932943] font-bold text-sm rounded hover:bg-opacity-90 transition-all uppercase tracking-wider">
          RESET
        </button>
      </div>
    </div>

  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden p-4 z-50">
    <div class="bg-[#722034] border border-pink-custom/30 rounded-xl p-6 w-full max-w-md text-yellow-custom space-y-4 shadow-2xl">
      <h3 class="text-xl font-bold font-serif-custom">Edit Target Dates</h3>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-pink-custom mb-1">D-DAY TARGET DATE</label>
          <input type="datetime-local" id="dday-input" class="w-full p-2 rounded bg-black/30 border border-pink-custom/40 text-yellow-custom focus:outline-none focus:border-pink-custom">
        </div>
        <div>
          <label class="block text-xs font-semibold text-pink-custom mb-1">CLEAN START DATE</label>
          <input type="datetime-local" id="clean-input" class="w-full p-2 rounded bg-black/30 border border-pink-custom/40 text-yellow-custom focus:outline-none focus:border-pink-custom">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleSettingsModal()" class="px-4 py-2 text-xs text-pink-custom hover:underline">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-pink-custom text-[#932943] font-bold text-xs rounded hover:bg-opacity-90">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // Load or initialize dates
    let dDayTarget = localStorage.getItem('dday_date') 
      ? new Date(localStorage.getItem('dday_date')) 
      : new Date(Date.now() + 5 * 24 * 60 * 60 * 1000);

    let cleanStartDate = localStorage.getItem('clean_date') 
      ? new Date(localStorage.getItem('clean_date')) 
      : new Date(Date.now() - (19 * 24 * 60 * 60 * 1000 + 23 * 3600 * 1000 + 36 * 60 * 1000));

    // Timer Variables
    let timerDuration = 25 * 60; 
    let timeLeft = timerDuration;
    let timerInterval = null;
    let isRunning = false;

    // Initialize Inputs
    document.getElementById('dday-input').value = dDayTarget.toISOString().slice(0, 16);
    document.getElementById('clean-input').value = cleanStartDate.toISOString().slice(0, 16);

    // Live Tracker Calculation
    function updateTrackers() {
      const now = new Date();

      // 1. D-Day Remaining Days Calculation
      const dDayDiff = dDayTarget - now;
      const daysLeft = Math.max(0, Math.ceil(dDayDiff / (1000 * 60 * 60 * 24)));
      document.getElementById('dday-count').innerText = daysLeft;

      // 2. Clean For Breakdown Calculation
      let cleanDiff = Math.max(0, now - cleanStartDate);

      const seconds = Math.floor((cleanDiff / 1000) % 60);
      const minutes = Math.floor((cleanDiff / (1000 * 60)) % 60);
      const hours = Math.floor((cleanDiff / (1000 * 60 * 60)) % 24);
      const totalDays = Math.floor(cleanDiff / (1000 * 60 * 60 * 24));

      const years = Math.floor(totalDays / 365);
      const months = Math.floor((totalDays % 365) / 30);
      const weeks = Math.floor(((totalDays % 365) % 30) / 7);
      const days = Math.floor(((totalDays % 365) % 30) % 7);

      document.getElementById('clean-yrs').innerText = years;
      document.getElementById('clean-mos').innerText = months;
      document.getElementById('clean-wks').innerText = weeks;
      document.getElementById('clean-days').innerText = days;
      document.getElementById('clean-hrs').innerText = hours;
      document.getElementById('clean-min').innerText = minutes;
      document.getElementById('clean-sec').innerText = seconds;
    }

    // Run every second for live updates
    setInterval(updateTrackers, 1000);
    updateTrackers();

    // Timer Logic
    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('start-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = 'START';
      } else {
        isRunning = true;
        btn.innerText = 'PAUSE';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            btn.innerText = 'START';
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = timerDuration;
      document.getElementById('start-btn').innerText = 'START';
      updateTimerDisplay();
    }

    // Modal & Settings Handlers
    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
    }

    function saveSettings() {
      const newDday = document.getElementById('dday-input').value;
      const newClean = document.getElementById('clean-input').value;

      if (newDday) {
        dDayTarget = new Date(newDday);
        localStorage.setItem('dday_date', dDayTarget.toISOString());
      }
      if (newClean) {
        cleanStartDate = new Date(newClean);
        localStorage.setItem('clean_date', cleanStartDate.toISOString());
      }

      updateTrackers();
      toggleSettingsModal();
    }
  </script>
</body>
</html>
